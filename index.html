<!DOCTYPE html>
<html lang="zh-HK" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="多功能計數機：BMI、按揭、聚會分帳、超市購物、壽司朗，可自訂常用" />
  <title>多功能計數機</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
  <!-- Local assets for reliable offline UI -->
  <link rel="stylesheet" href="./tailwind-built.css">
  <script src="./lucide.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    html, body { overscroll-behavior: none; height: 100%; overflow: hidden; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .panel {
      overscroll-behavior: contain;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    #viewport {
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }
    #track {
      touch-action: pan-y;
    }
    .swiping { user-select: none; -webkit-user-select: none; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .card { background: white; border-radius: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04); border: 1px solid #f1f5f9; }
    .btn-soft-minus { background: #f1f5f9; color: #64748b; }
    .btn-soft-plus { background: #fff1f2; color: #e11d48; }
    .btn-soft-minus:active, .btn-soft-plus:active { transform: scale(0.96); }
    /* extra colors for time / unit calculators */
    .text-purple-500 { color: #a855f7; }
    .text-purple-100 { color: #f3e8ff; }
    .from-purple-500 { --tw-gradient-from: #a855f7 var(--tw-gradient-from-position); --tw-gradient-to: rgb(168 85 247 / 0) var(--tw-gradient-to-position); --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to); }
    .bg-teal-500 { background-color: #14b8a6; }
    .text-teal-600 { color: #0d9488; }
    .text-teal-100 { color: #ccfbf1; }
    .from-teal-500 { --tw-gradient-from: #14b8a6 var(--tw-gradient-from-position); --tw-gradient-to: rgb(20 184 166 / 0) var(--tw-gradient-to-position); --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to); }
    .to-emerald-600 { --tw-gradient-to: #059669 var(--tw-gradient-to-position); }
    .border-teal-100 { border-color: #ccfbf1; }
    .bg-teal-50 { background-color: #f0fdfa; }
    .bg-slate-700 { background-color: #334155; }
    .cheque-preview {
      background: linear-gradient(135deg, #f0f7fc 0%, #e8f0f8 100%);
      background-image: radial-gradient(#c5d8ea 0.6px, transparent 0.6px);
      background-size: 10px 10px;
    }
    .cheque-crossed { position: relative; }
    .cheque-crossed::before {
      content: '';
      position: absolute;
      top: 8px; left: 12px;
      width: 56px; height: 36px;
      border-left: 2px solid #1e3a5f;
      border-right: 2px solid #1e3a5f;
      transform: rotate(-25deg);
      pointer-events: none; z-index: 5;
    }
    .cheque-crossed::after {
      content: 'A/C PAYEE ONLY';
      position: absolute;
      top: 18px; left: 6px;
      font-size: 7px; font-weight: 700;
      color: #1e3a5f;
      transform: rotate(-25deg);
      white-space: nowrap;
      pointer-events: none; z-index: 5;
    }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased">
  <div id="app" class="h-full flex flex-col max-w-lg mx-auto relative bg-slate-50">

    <header id="topbar" class="px-4 py-3 flex items-center justify-between sticky top-0 z-30 shrink-0 bg-white border-b border-slate-100 shadow-sm">
      <div class="flex items-center gap-2.5 min-w-0">
        <button id="btn-home" class="hidden w-9 h-9 rounded-xl bg-slate-100 flex items-center justify-center shrink-0 active:scale-95 transition" aria-label="返回首頁">
          <i data-lucide="arrow-left" class="w-5 h-5 text-slate-600"></i>
        </button>
        <div id="hdr-icon" class="w-9 h-9 rounded-xl bg-indigo-500 flex items-center justify-center shadow-sm shrink-0">
          <i data-lucide="layout-grid" class="w-5 h-5 text-white"></i>
        </div>
        <div class="min-w-0">
          <h1 id="hdr-title" class="text-base font-bold text-slate-800 leading-tight truncate">全部計數機</h1>
          <p id="hdr-sub" class="text-[10px] text-slate-400 truncate">選擇計算機 · 可自訂底部常用</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btn-edit-fav" class="flex items-center text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-full transition active:scale-95 font-medium" aria-label="編輯常用計算機">
          <i data-lucide="star" class="w-3.5 h-3.5 mr-1"></i> 常用
        </button>
        <button id="btn-reset" class="hidden flex items-center text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-full transition active:scale-95 font-medium" aria-label="重設目前計數機">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 mr-1"></i> 重設
        </button>
      </div>
    </header>

    <div id="viewport" class="flex-1 overflow-hidden relative">
      <div id="track" class="flex h-full" style="transform: translateX(0)">
      </div>
    </div>

    <nav class="bg-white border-t border-slate-100 px-1 py-2 flex justify-around items-center shrink-0 z-30 safe-bottom shadow-[0_-2px_10px_rgba(0,0,0,0.04)]" role="tablist" aria-label="計數機切換">
    </nav>
  </div>

<script>
(function () {
  'use strict';

  // 全部可用的計算機（之後加新機就只係喺呢度加）
  const CALCS = [
    { id: 'bmi', name: 'BMI & 熱量', short: 'BMI', icon: 'activity', accent: 'text-rose-500', bg: 'bg-rose-500', desc: 'BMI、BMR、TDEE 熱量分析' },
    { id: 'mortgage', name: '按揭計數機', short: '按揭', icon: 'home', accent: 'text-blue-500', bg: 'bg-blue-500', desc: '每月供款、利息、最低月入' },
    { id: 'party', name: '聚會分帳', short: '分帳', icon: 'party-popper', accent: 'text-indigo-500', bg: 'bg-indigo-500', desc: '多人分帳、結算誰欠誰' },
    { id: 'supermarket', name: '超市購物', short: '超市', icon: 'shopping-cart', accent: 'text-emerald-500', bg: 'bg-emerald-500', desc: '購物清單、預算、折扣' },
    { id: 'sushiro', name: '壽司朗', short: '壽司', icon: 'utensils', accent: 'text-orange-500', bg: 'bg-orange-500', desc: '各色盤子計數、加一服務費' },
    { id: 'time', name: '時間計算機', short: '時間', icon: 'clock', accent: 'text-purple-500', bg: 'bg-purple-500', desc: '日期相差、時間相差、日期加減' },
    { id: 'unit', name: '單位轉換', short: '單位', icon: 'ruler', accent: 'text-teal-600', bg: 'bg-teal-500', desc: '長度面積、重量、烹飪、鞋碼衣碼' },
    { id: 'cheque', name: '支票本本', short: '支票', icon: 'banknote', accent: 'text-slate-600', bg: 'bg-slate-700', desc: '港幣大寫、劃線支票、開票紀錄' },
  ];

  // BMI bar segments: [min, max, widthPercent]
  const BMI_SEGMENTS = [
    { min: 0, max: 18.5, width: 20, label: '過輕' },
    { min: 18.5, max: 24, width: 30, label: '適中' },
    { min: 24, max: 28, width: 25, label: '過重' },
    { min: 28, max: 40, width: 25, label: '肥胖' },
  ];

  // 底部常用（最多 5 個），會記住
  const MAX_FAV = 5;
  let favorites = JSON.parse(localStorage.getItem('fav_calcs') || 'null');
  if (!Array.isArray(favorites) || !favorites.length) {
    favorites = CALCS.map(c => c.id).slice(0, MAX_FAV);
  }
  favorites = favorites.filter(id => CALCS.some(c => c.id === id)).slice(0, MAX_FAV);

  // 目前顯示：null = 首頁，否則係計算機 id
  let currentId = null;
  let editFavMode = false;
  let homeSearch = ''; // 首頁搜尋關鍵字
  let idx = 0, startX = 0, startY = 0, currX = 0, dragging = false, panelW = 0, locked = null;

  const $ = id => document.getElementById(id);
  const val = (id, def = 0) => parseFloat($(id)?.value) || def;
  const txt = (id, v) => { if ($(id)) $(id).textContent = v; };
  const round1 = n => Math.round(n * 10) / 10;
  const money = n => round1(n).toFixed(1);
  const getCalc = id => CALCS.find(c => c.id === id);

  function saveFavorites() {
    localStorage.setItem('fav_calcs', JSON.stringify(favorites));
  }

  function buildShell() {
    const track = $('track');
    // Home panel + 所有計算機 panels（方便之後直接跳去任何一個）
    track.innerHTML = `
      <div class="panel w-full h-full shrink-0 overflow-y-auto bg-slate-50" data-i="0" id="panel-home" role="tabpanel">
        <div class="p-4 pb-8 min-h-full" id="content-home"></div>
      </div>
      ${CALCS.map((c, i) => `
      <div class="panel w-full h-full shrink-0 overflow-y-auto bg-slate-50" data-i="${i + 1}" id="panel-${c.id}" role="tabpanel">
        <div class="p-4 pb-8 min-h-full" id="content-${c.id}"></div>
      </div>`).join('')}`;

    renderBottomNav();
    initHome();
    if (window.lucide) lucide.createIcons();
    setupSwipe();
    setupNav();

    $('btn-reset').onclick = () => {
      if (currentId) window.dispatchEvent(new CustomEvent('reset-calc', { detail: { id: currentId } }));
    };
    $('btn-home').onclick = () => goHome(true);
    $('btn-edit-fav').onclick = () => toggleEditFav();
  }

  function renderBottomNav() {
    const nav = document.querySelector('nav');
    const favList = favorites.map(id => getCalc(id)).filter(Boolean);
    nav.innerHTML = favList.map((c) => {
      const active = currentId === c.id;
      return `
      <button class="nav-btn flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl min-w-[56px] transition ${active ? 'bg-slate-100' : ''}"
        data-id="${c.id}" role="tab" aria-selected="${active}" aria-label="${c.name}">
        <i data-lucide="${c.icon}" class="w-5 h-5 ${active ? c.accent : 'text-slate-400'}"></i>
        <span class="text-[10px] font-medium ${active ? 'text-slate-800' : 'text-slate-400'}">${c.short}</span>
      </button>`;
    }).join('');
    if (window.lucide) lucide.createIcons();
    setupNav();
  }

  // 面板順序：0 = home, 1..n = CALCS
  function panelIndexOf(id) {
    if (id === null || id === 'home') return 0;
    const i = CALCS.findIndex(c => c.id === id);
    return i >= 0 ? i + 1 : 0;
  }

  function goHome(anim = true) {
    currentId = null;
    editFavMode = false;
    goTo(0, anim);
  }

  function openCalc(id, anim = true) {
    if (!getCalc(id)) return;
    currentId = id;
    editFavMode = false;
    goTo(panelIndexOf(id), anim);
  }

  function goTo(i, anim = true) {
    const total = CALCS.length + 1; // home + all
    if (i < 0 || i >= total) return;
    idx = i;
    if (i === 0) currentId = null;
    else currentId = CALCS[i - 1].id;

    panelW = $('viewport').clientWidth;
    currX = -i * panelW;
    const t = $('track');
    if (anim) {
      t.style.willChange = 'transform';
      t.style.transition = 'transform .22s cubic-bezier(0.2, 0.0, 0.0, 1)';
      const onEnd = () => { t.style.willChange = 'auto'; t.style.transition = 'none'; t.removeEventListener('transitionend', onEnd); };
      t.addEventListener('transitionend', onEnd);
    } else {
      t.style.transition = 'none';
      t.style.willChange = 'auto';
    }
    t.style.transform = `translateX(${currX}px)`;
    updateHeader();
    renderBottomNav();
  }

  function updateHeader() {
    const isHome = currentId === null;
    const btnHome = $('btn-home');
    const btnReset = $('btn-reset');
    const btnEdit = $('btn-edit-fav');
    const icon = $('hdr-icon');

    if (isHome) {
      btnHome.classList.add('hidden');
      btnReset.classList.add('hidden');
      btnEdit.classList.remove('hidden');
      icon.className = 'w-9 h-9 rounded-xl bg-indigo-500 flex items-center justify-center shadow-sm shrink-0';
      icon.innerHTML = '<i data-lucide="layout-grid" class="w-5 h-5 text-white"></i>';
      $('hdr-title').textContent = editFavMode ? '選擇常用（最多5個）' : '全部計數機';
      $('hdr-sub').textContent = editFavMode ? '點星號加入／移出底部' : '選擇計算機 · 可自訂底部常用';
      btnEdit.innerHTML = editFavMode
        ? '<i data-lucide="check" class="w-3.5 h-3.5 mr-1"></i> 完成'
        : '<i data-lucide="star" class="w-3.5 h-3.5 mr-1"></i> 常用';
    } else {
      const c = getCalc(currentId);
      btnHome.classList.remove('hidden');
      btnReset.classList.remove('hidden');
      btnEdit.classList.add('hidden');
      icon.className = `w-9 h-9 rounded-xl ${c.bg} flex items-center justify-center shadow-sm shrink-0`;
      icon.innerHTML = `<i data-lucide="${c.icon}" class="w-5 h-5 text-white"></i>`;
      $('hdr-title').textContent = c.name;
      $('hdr-sub').textContent = '返回首頁可切換其他計算機';
    }
    if (window.lucide) lucide.createIcons();
    // 唔好喺呢度 renderHomeGrid：會拆咗 DOM，iPhone 上 click 會失效
  }

  function toggleEditFav() {
    if (currentId !== null) return;
    editFavMode = !editFavMode;
    updateHeader();
    renderHomeGrid(); // 只喺切換編輯模式時重繪
  }

  function toggleFavorite(id) {
    const pos = favorites.indexOf(id);
    if (pos >= 0) {
      if (favorites.length <= 1) return; // 至少留一個
      favorites.splice(pos, 1);
    } else {
      if (favorites.length >= MAX_FAV) {
        // 已滿：把最舊的頂走，或提示
        favorites.shift();
      }
      favorites.push(id);
    }
    saveFavorites();
    renderBottomNav();
    renderHomeGrid();
  }

  // ========== Home grid ==========
  function initHome() {
    renderHomeGrid();
  }

  function renderHomeGrid() {
    const el = $('content-home');
    if (!el) return;
    const favSet = new Set(favorites);
    const q = (homeSearch || '').trim().toLowerCase();
    const filtered = q
      ? CALCS.filter(c =>
          c.name.toLowerCase().includes(q) ||
          c.short.toLowerCase().includes(q) ||
          (c.desc || '').toLowerCase().includes(q) ||
          c.id.toLowerCase().includes(q)
        )
      : CALCS;

    el.innerHTML = `
      <div class="space-y-4">
        <!-- 搜尋欄（置頂） -->
        <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3 py-2.5 shadow-sm focus-within:ring-2 focus-within:ring-indigo-400">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>
          <input type="search" id="home-search" value="${homeSearch.replace(/"/g, '&quot;')}"
            placeholder="搜尋計算機（名稱、簡稱…）"
            class="flex-1 min-w-0 bg-transparent text-sm text-slate-800 placeholder:text-slate-400 outline-none border-0 p-0"
            autocomplete="off" enterkeyhint="search">
          <button type="button" id="home-search-clear" class="${q ? 'flex' : 'hidden'} w-7 h-7 rounded-full bg-slate-100 items-center justify-center text-slate-400 hover:text-slate-600 shrink-0" aria-label="清除搜尋">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        ${editFavMode ? `
        <div class="bg-amber-50 border border-amber-100 rounded-xl px-3 py-2.5 text-xs text-amber-800 flex items-center gap-2">
          <i data-lucide="info" class="w-4 h-4 text-amber-500 shrink-0"></i>
          <span>已選 <b>${favorites.length}</b> / ${MAX_FAV} 個常用。再點星號可加入或移出。</span>
        </div>` : ''}

        <div class="grid grid-cols-2 gap-3" id="home-grid">
          ${filtered.length ? filtered.map(c => {
            const isFav = favSet.has(c.id);
            return `
            <button type="button" class="home-card relative text-left bg-white p-4 rounded-2xl border border-slate-100 shadow-sm active:scale-[0.98] transition hover:border-slate-200"
              data-id="${c.id}">
              <div class="flex items-start justify-between gap-2 mb-3">
                <div class="w-11 h-11 rounded-xl ${c.bg} flex items-center justify-center shadow-sm">
                  <i data-lucide="${c.icon}" class="w-5 h-5 text-white"></i>
                </div>
                <span class="fav-star w-8 h-8 rounded-full flex items-center justify-center ${isFav ? 'bg-amber-50 text-amber-500' : 'bg-slate-50 text-slate-300'} ${editFavMode ? '' : 'opacity-80'}"
                  data-star="${c.id}" aria-label="${isFav ? '移出常用' : '加入常用'}">
                  <i data-lucide="star" class="w-4 h-4 ${isFav ? 'fill-current' : ''}"></i>
                </span>
              </div>
              <h3 class="font-bold text-slate-800 text-sm leading-snug">${c.name}</h3>
              <p class="text-[11px] text-slate-400 mt-1 leading-snug">${c.desc || ''}</p>
              ${isFav ? '<span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-amber-400"></span>' : ''}
            </button>`;
          }).join('') : `
            <div class="col-span-2 py-10 text-center text-slate-400 text-sm">
              <i data-lucide="search-x" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
              <p>找不到「${q}」相關的計算機</p>
              <button type="button" id="home-search-reset" class="mt-3 text-indigo-500 font-medium text-xs">清除搜尋</button>
            </div>`}
        </div>

        <p class="text-center text-[11px] text-slate-400 pt-1">
          ${q ? `找到 ${filtered.length} 個結果 · ` : ''}共 ${CALCS.length} 個計算機 · 底部 ${favorites.length} 個常用
        </p>
      </div>`;
    if (window.lucide) lucide.createIcons();

    // 搜尋輸入：即時過濾，保留游標位置
    const searchInput = $('home-search');
    if (searchInput) {
      searchInput.oninput = (e) => {
        homeSearch = e.target.value;
        const pos = e.target.selectionStart;
        renderHomeGrid();
        const again = $('home-search');
        if (again) {
          again.focus();
          try { again.setSelectionRange(pos, pos); } catch (_) {}
        }
      };
      // 避免滑動時誤觸
      searchInput.onclick = (e) => e.stopPropagation();
    }
    const clearBtn = $('home-search-clear');
    if (clearBtn) {
      clearBtn.onclick = (e) => {
        e.stopPropagation();
        homeSearch = '';
        renderHomeGrid();
        $('home-search')?.focus();
      };
    }
    const resetBtn = $('home-search-reset');
    if (resetBtn) {
      resetBtn.onclick = () => {
        homeSearch = '';
        renderHomeGrid();
      };
    }

    el.querySelectorAll('.home-card').forEach(card => {
      card.onclick = (e) => {
        const star = e.target.closest('[data-star]');
        if (star || editFavMode) {
          e.preventDefault();
          e.stopPropagation();
          toggleFavorite(card.dataset.id);
          return;
        }
        openCalc(card.dataset.id, true);
      };
    });
    el.querySelectorAll('[data-star]').forEach(star => {
      star.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        toggleFavorite(star.dataset.star);
      };
    });
  }

  // ========== Swipe (Home + all calcs) ==========
  let lastMoveX = 0, lastMoveT = 0, velocityX = 0;

  function setupSwipe() {
    const vp = $('viewport');
    const track = $('track');
    const total = () => CALCS.length + 1;
    const isInteractive = (el) => !!(el && el.closest && el.closest('input, select, button, textarea, a, label, .home-card, .nav-btn, [role="button"]'));

    const onStart = (x, y) => {
      dragging = true;
      startX = x;
      startY = y;
      lastMoveX = x;
      lastMoveT = performance.now();
      velocityX = 0;
      locked = null;
      panelW = vp.clientWidth;
      track.style.transition = 'none';
      // 唔好一開始就加 swiping，等確認係橫向滑先
    };

    const onMove = (x, y, e) => {
      if (!dragging) return;
      const dx = x - startX;
      const dy = y - startY;
      const now = performance.now();
      const dt = now - lastMoveT;
      if (dt > 0) {
        const v = (x - lastMoveX) / dt;
        velocityX = velocityX * 0.6 + v * 0.4;
      }
      lastMoveX = x;
      lastMoveT = now;

      if (!locked && (Math.abs(dx) > 12 || Math.abs(dy) > 12)) {
        locked = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'h' : 'v';
        if (locked === 'h') {
          document.body.classList.add('swiping');
          track.style.willChange = 'transform';
        }
      }
      // 垂直捲動：唔攔截，等瀏覽器處理
      if (locked === 'v' || locked !== 'h') return;
      if (e && e.cancelable) e.preventDefault();

      let d = dx;
      if (idx === 0 && d > 0) d = 0;
      if (idx === total() - 1 && d < 0) d = 0;
      track.style.transform = `translateX(${currX + d}px)`;
    };

    const onEnd = (x) => {
      if (!dragging) return;
      dragging = false;
      document.body.classList.remove('swiping');
      track.style.willChange = 'auto';

      // 冇確認橫向滑動 → 唔呼叫 goTo，避免重繪搶走 click
      if (locked !== 'h') {
        locked = null;
        velocityX = 0;
        return;
      }
      const d = x - startX;
      const th = panelW * 0.18;
      const flick = Math.abs(velocityX) > 0.35;
      if ((d < -th || (flick && velocityX < -0.35)) && idx < total() - 1) {
        goTo(idx + 1, true);
      } else if ((d > th || (flick && velocityX > 0.35)) && idx > 0) {
        goTo(idx - 1, true);
      } else {
        goTo(idx, true);
      }
      locked = null;
      velocityX = 0;
    };

    vp.addEventListener('touchstart', e => {
      if (isInteractive(e.target)) return; // 按鈕／輸入框唔啟動滑動
      const t = e.touches[0];
      onStart(t.clientX, t.clientY);
    }, { passive: true });
    vp.addEventListener('touchmove', e => {
      if (!dragging) return;
      const t = e.touches[0];
      onMove(t.clientX, t.clientY, e);
    }, { passive: false });
    vp.addEventListener('touchend', e => {
      if (!dragging) return;
      const t = e.changedTouches[0];
      onEnd(t.clientX);
    }, { passive: true });
    vp.addEventListener('touchcancel', () => {
      if (!dragging) return;
      dragging = false;
      document.body.classList.remove('swiping');
      track.style.willChange = 'auto';
      if (locked === 'h') goTo(idx, true);
      locked = null;
      velocityX = 0;
    }, { passive: true });
    vp.addEventListener('mousedown', e => {
      if (isInteractive(e.target)) return;
      e.preventDefault();
      onStart(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY, null));
    window.addEventListener('mouseup', e => onEnd(e.clientX));
    window.addEventListener('resize', () => goTo(idx, false));
  }

      txt('mtg-inc', Math.round(mon / 0.5).toLocaleString());
      txt('mtg-loan', (loan / 10000).toFixed(1));
      txt('mtg-int', (int / 10000).toFixed(1));
      txt('mtg-tot', (tot / 10000).toFixed(1));
      const body = $('mtg-body'); body.innerHTML = '';
      let bal = loan;
      for (let y = 1; y <= yrs; y++) {
        let yp = 0, yi = 0;
        for (let m = 0; m < 12; m++) {
          if (bal <= 0) break;
          const i = bal * mr, p = mon - i;
          yi += i; yp += p; bal -= p;

        tr.className = y % 2 ? '' : 'bg-slate-50/50';

        body.appendChild(tr);
      }

    const syncPct = () => { $('mtg-amt').value = ((val('mtg-price') * val('mtg-pct')) / 100).toFixed(1); };
    $('mtg-price').oninput = () => { syncPct(); calc(); };
    $('mtg-pct').oninput = () => { syncPct(); calc(); };
    $('mtg-amt').oninput = () => {
      const p = val('mtg-price');
      if (p > 0) $('mtg-pct').value = Math.min(100, Math.max(0, (val('mtg-amt') / p) * 100)).toFixed(1);
      calc();
    };
    $('mtg-ten').onchange = calc;
    $('mtg-rate').oninput = calc;
    $('mtg-mip').onchange = calc;
    $('mtg-tog').onclick = () => {
      const h = $('mtg-sch').classList.toggle('hidden');

        $('mtg-price').value = 600; $('mtg-pct').value = 30; $('mtg-ten').value = 30; $('mtg-rate').value = 4.125; $('mtg-mip').checked = false;

      }
    });
    syncPct(); calc();
  }

    // last computed transfers for copy
    let lastTransfers = [];
    const save = () => { localStorage.setItem('pty_m', JSON.stringify(members)); localStorage.setItem('pty_e', JSON.stringify(expenses)); };

    function renderMembers() {
      $('pty-n').textContent = members.length;
      const pills = $('pty-pills'), payer = $('pty-payer'), cbs = $('pty-cbs');
      pills.innerHTML = ''; payer.innerHTML = ''; cbs.innerHTML = '';
      if (!members.length) { pills.innerHTML = '<span class="text-xs text-slate-400">請先新增朋友</span>'; return; }
      members.forEach(m => {
        const p = document.createElement('div');
        p.className = 'flex items-center bg-white border border-indigo-200 text-indigo-700 text-xs font-semibold px-3 py-1.5 rounded-full shadow-sm';

        p.querySelector('button').onclick = () => {
          // Remove member from participants; drop expenses that end up with 0 participants
          members = members.filter(x => x !== m);
          const before = expenses.length;
          expenses = expenses.filter(e => {
            e.participants = e.participants.filter(pp => pp !== m);
            if (e.payer === m) e.payer = members[0] || '';
            return e.participants.length > 0 && e.payer;
          });
          const removed = before - expenses.length;
          save();
          renderAll();
          if (removed > 0) {
            // Brief notice
            const note = document.createElement('div');
            note.className = 'fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2 rounded-full shadow-lg z-50';
            note.textContent = `已移除 ${m}，並清理了 ${removed} 筆無參與者的消費`;
            document.body.appendChild(note);
            setTimeout(() => note.remove(), 2500);
          }
        };
        pills.appendChild(p);
        const o = document.createElement('option'); o.value = m; o.textContent = m; payer.appendChild(o);
        const lb = document.createElement('label');
        lb.className = 'flex items-center gap-1 border border-slate-200 px-2 py-1 rounded-lg bg-white cursor-pointer';
        lb.innerHTML = `<input type="checkbox" value="${m}" checked class="pty-cb rounded accent-indigo-500"> <span>${m}</span>`;

    }

    function renderExps() {
      const list = $('pty-list'); list.innerHTML = '';
      $('pty-badge').textContent = expenses.length + ' 項';
      if (!expenses.length) { list.innerHTML = '<li class="p-6 text-center text-slate-400 text-sm">暫無消費</li>'; return; }
      expenses.forEach(exp => {
        const li = document.createElement('li');
        li.className = 'px-4 py-3 flex justify-between items-center text-sm';
        const st = exp.participants.length === members.length ? '所有人' : exp.participants.length + '人';
        li.innerHTML = `<div class="flex-1 min-w-0"><div class="flex items-center gap-2"><span class="font-bold text-slate-700 truncate">${exp.title}</span><span class="text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-md font-medium">${exp.payer}付</span></div><p class="text-xs text-slate-400">${st}</p></div><div class="flex items-center gap-3"><span class="font-black text-slate-800">$${money(exp.amount)}</span><button type="button" class="text-slate-300 hover:text-red-500" data-id="${exp.id}" aria-label="刪除消費"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`;

      });

    }

    function settle() {
      const tot = expenses.reduce((s, e) => s + e.amount, 0);
      txt('pty-tot', money(tot));
      txt('pty-avg', money(members.length ? tot / members.length : 0));
      const bals = {}; members.forEach(m => bals[m] = 0);
      expenses.forEach(exp => {
        if (!exp.participants || exp.participants.length === 0) return;
        if (bals[exp.payer] !== undefined) bals[exp.payer] = round1(bals[exp.payer] + exp.amount);
        const sh = exp.amount / exp.participants.length;
        exp.participants.forEach(p => {
          if (bals[p] !== undefined) bals[p] = round1(bals[p] - sh);
        });
      });
      const bl = $('pty-bals'); bl.innerHTML = '';
      members.forEach(m => {
        const b = bals[m] || 0;
        const d = document.createElement('div');
        d.className = 'flex justify-between items-center bg-white px-3 py-1.5 rounded-lg border border-emerald-100';
        d.innerHTML = `<span class="font-medium text-slate-600">${m}</span>${Math.abs(b) < 0.05 ? '<span class="text-slate-400">$0</span>' : b > 0 ? `<span class="text-emerald-600 font-bold">應收回 +$${money(b)}</span>` : `<span class="text-red-500 font-bold">應支付 -$${money(Math.abs(b))}</span>`}`;
        bl.appendChild(d);
      });
      const debt = [], cred = [];
      Object.keys(bals).forEach(m => {
        const b = bals[m];
        if (b < -0.05) debt.push({ n: m, a: -b });
        else if (b > 0.05) cred.push({ n: m, a: b });
      });
      const trans = []; let i = 0, j = 0;
      while (i < debt.length && j < cred.length) {
        const a = Math.min(debt[i].a, cred[j].a);
        trans.push({ f: debt[i].n, t: cred[j].n, a: round1(a) });
        debt[i].a = round1(debt[i].a - a); cred[j].a = round1(cred[j].a - a);
        if (debt[i].a < 0.05) i++;
        if (cred[j].a < 0.05) j++;
      }
      lastTransfers = trans;
      const tl = $('pty-trans'); tl.innerHTML = '';
      if (!trans.length) tl.innerHTML = '<div class="bg-white p-3 rounded-xl border border-emerald-100 text-center text-slate-400 text-xs">帳目平衡</div>';
      else {
        trans.forEach(t => {
          const c = document.createElement('div');
          c.className = 'bg-white p-3 rounded-xl border border-emerald-200 flex items-center justify-between shadow-sm';
          c.innerHTML = `<div class="flex items-center gap-2"><span class="font-bold text-red-500">${t.f}</span><i data-lucide="arrow-right" class="w-4 h-4 text-slate-300"></i><span class="font-bold text-emerald-600">${t.t}</span></div><span class="font-black text-slate-800">$${money(t.a)}</span>`;
          tl.appendChild(c);
        });
        if (window.lucide) lucide.createIcons();
      }
    }

    function renderAll() { renderMembers(); renderExps(); settle(); }

    function buildCopyText() {
      const tot = expenses.reduce((s, e) => s + e.amount, 0);
      let t = `🎉 Party 結帳紀錄\n----------------------\n總花費: $${money(tot)}\n\n`;
      t += `【轉帳指示】\n`;
      if (!lastTransfers.length) {
        t += `帳目已平衡，無須轉帳\n`;
      } else {
        lastTransfers.forEach(tr => {
          t += `${tr.f} ➡️ ${tr.t} : $${money(tr.a)}\n`;
        });
      }
      t += `\n（由多功能計數機產生）`;
      return t;
    }

    $('pty-fm').onsubmit = e => {
      e.preventDefault();

    $('pty-mode').onchange = e => $('pty-cbs-wrap').classList.toggle('hidden', e.target.value !== 'CUSTOM');
    $('pty-ef').onsubmit = e => {
      e.preventDefault();
      const title = $('pty-title').value, amount = parseFloat($('pty-amt').value), payer = $('pty-payer').value;
      const mode = $('pty-mode').value;
      let parts = mode === 'ALL' ? [...members] : [...document.querySelectorAll('.pty-cb:checked')].map(c => c.value);
      if (!payer || !parts.length || isNaN(amount) || amount <= 0) return;
      expenses.unshift({ id: Date.now().toString(), title, amount: round1(amount), payer, participants: parts });
      save(); renderAll();
      $('pty-title').value = ''; $('pty-amt').value = '';
    };
    $('pty-copy').onclick = async () => {
      const text = buildCopyText();
      try {
        await navigator.clipboard.writeText(text);
        const btn = $('pty-copy');
        const old = btn.innerHTML;
        btn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5"></i> 已複製';
        if (window.lucide) lucide.createIcons();
        setTimeout(() => { btn.innerHTML = old; if (window.lucide) lucide.createIcons(); }, 1800);
      } catch {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('已複製結帳結果');
      }
    };
    window.addEventListener('reset-calc', e => {
      if (e.detail.id === 'party') { members = ['阿Dave','May','Ben']; expenses = []; save(); renderAll(); }
    });
    renderAll();
  }

              <button type="button" class="sm-qm w-6 h-6 rounded bg-white text-slate-500 font-bold text-xs shadow-sm" data-id="${it.id}" aria-label="減少">-</button>
              <span class="w-7 text-center font-bold text-xs">${it.qty}</span>
              <button type="button" class="sm-qp w-6 h-6 rounded bg-white text-slate-500 font-bold text-xs shadow-sm" data-id="${it.id}" aria-label="增加">+</button>
            </div>
            <span class="font-bold text-slate-800 w-16 text-right">$${money(it.price * it.qty)}</span>
            <button type="button" class="sm-del text-slate-300 hover:text-red-500" data-id="${it.id}" aria-label="刪除"><i data-lucide="trash" class="w-4 h-4"></i></button>
          </div>`;
        li.querySelector('.sm-qm').onclick = () => updQty(it.id, -1);
        li.querySelector('.sm-qp').onclick = () => updQty(it.id, 1);
        li.querySelector('.sm-del').onclick = () => { items = items.filter(x => x.id !== it.id); save(); render(); };
        list.appendChild(li);
      });
      if (window.lucide) lucide.createIcons();
      calc();
    }

    function updQty(id, d) {
      const it = items.find(x => x.id === id);
      if (!it) return;
      it.qty += d;
      if (it.qty <= 0) items = items.filter(x => x.id !== id);
      save(); render();
    }

    function calc() {
      const sub = items.reduce((s, i) => s + i.price * i.qty, 0);
      const grand = sub * disc;
      const saveAmt = sub - grand;
      txt('sm-sub', money(sub));
      txt('sm-grand', money(grand));
      $('sm-save').textContent = saveAmt > 0.05 ? `已省 $${money(saveAmt)}` : '';
      if (budget != null && budget > 0) {
        $('sm-bar-wrap').classList.remove('hidden');
        const pct = Math.min(Math.round(grand / budget * 100), 100);
        const rem = budget - grand;
        $('sm-pct').textContent = pct + '%';
        $('sm-bar').style.width = pct + '%';
        if (rem < -0.05) {
          $('sm-bar').className = 'bg-red-500 h-2 rounded-full transition-all';
          $('sm-status').innerHTML = `<span class="inline-block bg-red-50 text-red-600 text-xs font-bold px-2.5 py-1 rounded-full">超出 $${money(Math.abs(rem))}</span>`;
        } else {
          $('sm-bar').className = 'bg-emerald-500 h-2 rounded-full transition-all';
          $('sm-status').innerHTML = `<span class="text-xs text-slate-400 block">剩餘</span><span class="text-sm font-bold text-emerald-600">$${money(rem)}</span>`;
        }
      } else {
        $('sm-bar-wrap').classList.add('hidden');
        $('sm-status').innerHTML = '';
      }
    }

    $('sm-minus').onclick = () => { const v = +$('sm-qty').value || 1; if (v > 1) $('sm-qty').value = v - 1; };
    $('sm-plus').onclick = () => { $('sm-qty').value = (+$('sm-qty').value || 1) + 1; };
    $('sm-form').onsubmit = e => {
      e.preventDefault();
      const name = $('sm-name').value, price = parseFloat($('sm-price').value), qty = +$('sm-qty').value || 1;
      if (isNaN(price) || price < 0) return;
      items.unshift({ id: Date.now().toString(), name, price: round1(price), qty });
      save(); render();
      $('sm-name').value = ''; $('sm-price').value = ''; $('sm-qty').value = 1; $('sm-price').focus();
    };
    if (budget != null) $('sm-budget').value = budget;
    $('sm-budget').oninput = e => { const v = parseFloat(e.target.value); budget = !isNaN(v) && v > 0 ? v : null; saveB(); calc(); };
    $('sm-disc').onchange = e => { disc = parseFloat(e.target.value); calc(); };
    window.addEventListener('reset-calc', e => {
      if (e.detail.id === 'supermarket') { items = []; save(); render(); }
    });
    render();
  }

    function renderGrid() {
      const g = $('su-grid'); g.innerHTML = '';
      plates.forEach(p => {
        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between space-y-3';
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-xl ${p.color || 'bg-red-400'} flex items-center justify-center text-lg shadow-inner text-white">${p.icon || '🍣'}</div>
              <div>
                <h3 class="font-bold text-slate-700 text-sm leading-snug">${p.name}</h3>
                <span class="font-extrabold text-red-500 text-sm">$${p.price}</span>
              </div>
            </div>
            <span class="text-xs font-bold text-slate-400 bg-slate-50 px-2.5 py-1 rounded-lg" data-count="${p.id}">${p.count} 份</span>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" class="su-m flex-1 py-2.5 rounded-xl font-extrabold text-lg btn-soft-minus active:scale-95 transition" data-id="${p.id}" aria-label="減少 ${p.name}">−</button>
            <div class="w-14 py-2 bg-slate-50 border border-slate-100 rounded-xl text-center font-extrabold text-slate-800 text-base" data-num="${p.id}">${p.count}</div>
            <button type="button" class="su-p flex-1 py-2.5 rounded-xl font-extrabold text-lg btn-soft-plus active:scale-95 transition" data-id="${p.id}" aria-label="增加 ${p.name}">+</button>
          </div>`;
        card.querySelector('.su-p').onclick = () => { p.count++; saveP(); updatePlateUI(p); calcAndSum(); };
        card.querySelector('.su-m').onclick = () => { p.count = Math.max(0, p.count - 1); saveP(); updatePlateUI(p); calcAndSum(); };
        g.appendChild(card);
      });
    }

    function updatePlateUI(p) {
      const num = document.querySelector(`[data-num="${p.id}"]`);
      const cnt = document.querySelector(`[data-count="${p.id}"]`);
      if (num) num.textContent = p.count;
      if (cnt) cnt.textContent = p.count + ' 份';
    }

    function renderDishes() {
      const cont = $('su-dishes'), sel = $('su-dplate');
      cont.innerHTML = ''; sel.innerHTML = '';
      plates.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = `${p.name} ($${p.price})`; sel.appendChild(o); });
      dishes.forEach(d => {
        const tp = plates.find(p => p.id === d.plateId);
        const price = tp ? tp.price : 0;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'flex items-center gap-1.5 bg-slate-50 hover:bg-orange-50 border border-slate-100 hover:border-orange-200 px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 transition active:scale-95 shadow-sm';
        const badge = d.count > 0 ? `<span class="bg-orange-100 text-orange-600 px-1.5 rounded-md text-[10px] font-bold">${d.count}</span>` : '';
        btn.innerHTML = `<span>${d.icon || '🍣'}</span><span>${d.name}</span><span class="text-red-500 font-bold">($${price})</span>${badge}`;
        btn.onclick = () => {
          if (tp) {
            tp.count++;
            d.count = (d.count || 0) + 1;
            saveP(); saveD();
            updatePlateUI(tp);
            renderDishes();
            calcAndSum();
          }
        };
        cont.appendChild(btn);
      });
    }

    function renderSum() {
      const list = $('su-sum'); list.innerHTML = '';
      const selPlates = plates.filter(p => p.count > 0);
      const selDishes = dishes.filter(d => d.count > 0);
      const totC = plates.reduce((s, p) => s + p.count, 0);
      $('su-badge').textContent = `共 ${totC} 份`;
      if ($('su-badge-top')) $('su-badge-top').textContent = totC;

      if (!selPlates.length && !selDishes.length) {
        list.innerHTML = '<li class="p-4 text-center text-slate-400 text-xs">尚未記錄任何盤數</li>';
        return;
      }

      // Plate summary
      selPlates.forEach(p => {
        const li = document.createElement('li');
        li.className = 'px-4 py-2.5 flex justify-between items-center text-xs sm:text-sm';
        li.innerHTML = `<div class="flex items-center gap-2"><span>${p.icon}</span><span class="font-bold text-slate-700">${p.name}</span><span class="text-slate-400 text-xs">($${p.price})</span></div>
          <div class="flex items-center gap-3"><span class="font-semibold text-slate-500">x ${p.count}</span><span class="font-bold text-slate-800 w-14 text-right">$${p.price * p.count}</span></div>`;
        list.appendChild(li);
      });

      // Dish breakdown (if any tracked)
      if (selDishes.length) {
        const hdr = document.createElement('li');
        hdr.className = 'px-4 py-1.5 bg-slate-50 text-[10px] font-bold text-slate-400 uppercase';
        hdr.textContent = '特別料理明細';
        list.appendChild(hdr);
        selDishes.forEach(d => {
          const tp = plates.find(p => p.id === d.plateId);
          const price = tp ? tp.price : 0;
          const li = document.createElement('li');
          li.className = 'px-4 py-2 flex justify-between items-center text-xs text-slate-500';
          li.innerHTML = `<div class="flex items-center gap-2"><span>${d.icon}</span><span>${d.name}</span></div>
            <span class="font-medium">x ${d.count} · $${price * d.count}</span>`;
          list.appendChild(li);
        });
      }
    }

    function renderSettings() {
      const cont = $('su-setlist'); cont.innerHTML = '';
      plates.forEach(p => {
        const d = document.createElement('div');
        d.className = 'flex items-center gap-2 bg-white p-2 rounded-xl border border-orange-100 text-xs';
        d.innerHTML = `
          <input type="text" value="${p.icon || '🍣'}" class="w-8 px-1 py-1 text-center border border-slate-200 rounded-md bg-slate-50 outline-none" data-id="${p.id}" data-f="icon">
          <input type="text" value="${p.name}" class="flex-1 px-2 py-1 border border-slate-200 rounded-md font-medium text-slate-700 bg-slate-50 outline-none" data-id="${p.id}" data-f="name">
          <div class="flex items-center gap-1"><span class="text-slate-400">$</span><input type="number" min="0" value="${p.price}" inputmode="decimal" class="w-16 px-2 py-1 border border-slate-200 rounded-md font-bold text-slate-800 bg-slate-50 outline-none" data-id="${p.id}" data-f="price"></div>
          <button type="button" class="text-slate-300 hover:text-red-500 p-1" data-id="${p.id}" data-act="del" aria-label="刪除盤種"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>`;
        d.querySelectorAll('input').forEach(inp => {
          inp.onchange = () => {
            const pl = plates.find(x => x.id === inp.dataset.id);
            if (!pl) return;
            if (inp.dataset.f === 'icon') pl.icon = inp.value || '🍣';
            if (inp.dataset.f === 'name') pl.name = inp.value || '壽司盤';
            if (inp.dataset.f === 'price') pl.price = Math.max(0, parseFloat(inp.value) || 0);
            saveP(); renderGrid(); renderDishes(); calcAndSum();
          };
        });
        d.querySelector('[data-act="del"]').onclick = () => {
          if (plates.length <= 1) return;
          plates = plates.filter(x => x.id !== p.id);
          saveP(); renderGrid(); renderDishes(); renderSettings(); calcAndSum();
        };
        cont.appendChild(d);
      });
      if (window.lucide) lucide.createIcons();
    }

    function calc() {
      const sub = plates.reduce((s, p) => s + p.price * p.count, 0);
      const grand = svc ? sub * 1.1 : sub;
      txt('su-sub', sub);
      txt('su-grand', Math.round(grand).toLocaleString());
      $('su-extra').textContent = svc && sub > 0 ? '(已加 10% 服務費)' : '';
    }

    function calcAndSum() {
      calc();
      renderSum();
    }

    function refresh() {
      renderGrid(); renderDishes(); calcAndSum();
    }

    $('su-svc').onchange = e => { svc = e.target.checked; calc(); };
    $('su-edit').onclick = () => { $('su-settings').classList.toggle('hidden'); };
    $('su-addp').onclick = () => {
      plates.push({ id: Date.now().toString(), name: '新自訂盤', price: 20, icon: '🍱', color: 'bg-purple-500', count: 0 });
      saveP(); refresh(); renderSettings();
    };
    $('su-addd').onclick = () => $('su-dform').classList.toggle('hidden');
    $('su-dform').onsubmit = e => {
      e.preventDefault();
      const name = $('su-dname').value.trim();
      if (!name) return;
      dishes.push({ id: Date.now().toString(), name, plateId: $('su-dplate').value, icon: '🍣', count: 0 });
      saveD(); renderDishes(); $('su-dname').value = ''; $('su-dform').classList.add('hidden');
    };
    $('su-clear').onclick = () => {
      plates.forEach(p => p.count = 0);
      dishes.forEach(d => d.count = 0);
      saveP(); saveD(); refresh();
    };
    window.addEventListener('reset-calc', e => {
      if (e.detail.id === 'sushiro') {
        plates = JSON.parse(JSON.stringify(DEFAULT_PLATES));
        dishes = JSON.parse(JSON.stringify(DEFAULT_DISHES));
        svc = true; $('su-svc').checked = true;
        saveP(); saveD(); refresh(); renderSettings();
      }
    });

    refresh();
    renderSettings();
  }

    if (window.lucide) lucide.createIcons();

    let mode = 'date';

    const setTab = (m) => {
      mode = m;

        btn.className = on
          ? 'tm-tab flex-1 py-2.5 rounded-xl bg-purple-500 text-white shadow-sm'
          : 'tm-tab flex-1 py-2.5 rounded-xl text-slate-400';
      });
      $('tm-panel-date').classList.toggle('hidden', m !== 'date');
      $('tm-panel-time').classList.toggle('hidden', m !== 'time');
      $('tm-panel-add').classList.toggle('hidden', m !== 'add');
      if (m === 'date') calcDate();
      if (m === 'time') calcTime();
      if (m === 'add') calcAdd(0);
    };

    document.querySelectorAll('.tm-tab').forEach(btn => {
      btn.onclick = () => setTab(btn.dataset.tm);
    });

    // —— 日期相差 ——
    function calcDate() {
      const a = $('tm-d1').value;
      const b = $('tm-d2').value;
      if (!a || !b) return;
      const d1 = new Date(a + 'T00:00:00');
      const d2 = new Date(b + 'T00:00:00');
      const ms = d2 - d1;
      const days = Math.round(ms / 86400000);
      const abs = Math.abs(days);
      txt('tm-days', days);
      txt('tm-weeks', (abs / 7).toFixed(1));
      txt('tm-months', (abs / 30.437).toFixed(1));
      txt('tm-years', (abs / 365.25).toFixed(2));
      if (days === 0) txt('tm-date-hint', '同一天');
      else if (days > 0) txt('tm-date-hint', `結束日期在開始日期之後 ${abs} 天`);
      else txt('tm-date-hint', `結束日期在開始日期之前 ${abs} 天`);
    }
    $('tm-d1').oninput = calcDate;
    $('tm-d2').oninput = calcDate;
    $('tm-d-swap').onclick = () => {
      const t = $('tm-d1').value;
      $('tm-d1').value = $('tm-d2').value;
      $('tm-d2').value = t;
      calcDate();
    };
    $('tm-d-today').onclick = () => {
      $('tm-d2').value = toDateStr(new Date());
      calcDate();
    };

    // —— 時間相差 ——
    function calcTime() {
      const t1 = $('tm-t1').value;
      const t2 = $('tm-t2').value;
      if (!t1 || !t2) return;
      const [h1, m1] = t1.split(':').map(Number);
      const [h2, m2] = t2.split(':').map(Number);
      let sec1 = h1 * 3600 + m1 * 60;
      let sec2 = h2 * 3600 + m2 * 60;
      if ($('tm-cross-day').checked && sec2 <= sec1) sec2 += 86400;
      let diff = sec2 - sec1;
      const neg = diff < 0;
      diff = Math.abs(diff);
      const h = Math.floor(diff / 3600);
      const m = Math.floor((diff % 3600) / 60);
      const s = diff % 60;
      txt('tm-hms', `${neg ? '−' : ''}${h} 時 ${m} 分${s ? ' ' + s + ' 秒' : ''}`);
      txt('tm-total-h', (diff / 3600).toFixed(2));
      txt('tm-total-m', Math.floor(diff / 60));
      txt('tm-total-s', diff);
    }
    $('tm-t1').oninput = calcTime;
    $('tm-t2').oninput = calcTime;
    $('tm-cross-day').onchange = calcTime;

    // —— 日期加減 ——
    const weekNames = ['日', '一', '二', '三', '四', '五', '六'];
    function calcAdd(sign) {
      // sign: 1 add, -1 sub, 0 just refresh with last sign stored
      if (sign !== 0) calcAdd._last = sign;
      const s = calcAdd._last || 1;
      const base = $('tm-base').value;
      const amt = parseInt($('tm-amt').value, 10) || 0;
      const unit = $('tm-unit').value;
      if (!base) return;
      const d = new Date(base + 'T12:00:00');
      const n = s * amt;
      if (unit === 'day') d.setDate(d.getDate() + n);
      else if (unit === 'week') d.setDate(d.getDate() + n * 7);
      else if (unit === 'month') d.setMonth(d.getMonth() + n);
      else if (unit === 'year') d.setFullYear(d.getFullYear() + n);
      const str = toDateStr(d);
      txt('tm-result-date', str);
      txt('tm-result-week', `星期${weekNames[d.getDay()]} · ${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`);
    }
    calcAdd._last = 1;
    $('tm-add').onclick = () => calcAdd(1);
    $('tm-sub').onclick = () => calcAdd(-1);
    ['tm-base', 'tm-amt', 'tm-unit'].forEach(id => {
      $(id).oninput = () => calcAdd(0);
      $(id).onchange = () => calcAdd(0);
    });

    window.addEventListener('reset-calc', e => {

      const now = new Date();
      $('tm-d1').value = toDateStr(now);
      $('tm-d2').value = toDateStr(now);
      $('tm-t1').value = toTimeStr(now);
      $('tm-t2').value = toTimeStr(new Date(now.getTime() + 90 * 60000));
      $('tm-cross-day').checked = false;
      $('tm-base').value = toDateStr(now);
      $('tm-amt').value = 7;
      $('tm-unit').value = 'week';
      setTab('date');
      calcDate();
      calcTime();
      calcAdd(1);
    });

    calcDate();
    calcTime();
    calcAdd(1);
  }

    function fillSelects() {

    function fmt(n) {
      if (!isFinite(n)) return '—';
      const a = Math.abs(n);
      if (a === 0) return '0';
      if (a >= 1e6 || (a < 1e-4 && a > 0)) return n.toExponential(4);
      if (a >= 100) return (Math.round(n * 100) / 100).toString();
      if (a >= 1) return (Math.round(n * 10000) / 10000).toString();
      return (Math.round(n * 1e6) / 1e6).toString();
    }

    function convert() {
      if (cat === 'size') return;
      const list = UNITS[cat].list;
      const fromU = list.find(u => u.id === $('uc-from').value);
      const toU = list.find(u => u.id === $('uc-to').value);
      const val = parseFloat($('uc-val').value);
      if (!fromU || !toU || isNaN(val)) {
        txt('uc-result', '—');
        txt('uc-result-unit', '');
        return;
      }
      const base = val * fromU.toBase;
      const out = base / toU.toBase;
      txt('uc-result', fmt(out));
      txt('uc-result-unit', toU.name);

      const all = $('uc-all');
      all.innerHTML = list.map(u => {
        const v = base / u.toBase;
        const hl = u.id === toU.id ? 'bg-teal-50 font-bold text-teal-600' : 'text-slate-700';
        return `<li class="px-4 py-2.5 flex justify-between items-center ${hl}">
          <span class="text-slate-500 text-xs">${u.name}</span>
          <span class="font-semibold">${fmt(v)}</span>

    function lookupShoe() {
      const sys = $('uc-shoe-sys').value;

      let best = SHOE_TABLE[0], bestDiff = Infinity;
      SHOE_TABLE.forEach(row => {

        else if (sys === 'cm') v = parseFloat(row.cm);
        else if (sys === 'ukM') v = parseFloat(row.ukM);
        else if (sys === 'usM') v = parseFloat(row.usM);
        else if (sys === 'ukW') v = parseFloat(row.ukW);
        else if (sys === 'usW') v = parseFloat(row.usW);
        const d = Math.abs(v - val);
        if (d < bestDiff) { bestDiff = d; best = row; }
      });
      txt('sh-eu', best.eu);
      txt('sh-cm', best.cm);
      txt('sh-ukm', best.ukM);
      txt('sh-usm', best.usM);

  // ========== 8. 支票本本 ==========
  function initCheque() {
    const el = $('content-cheque');

    const todayStr = () => new Date().toISOString().slice(0, 10);

    // —— 中文大寫 ——
    function numToZhCap(n, useZheng = true) {
      const num = Math.round(parseFloat(n) * 100) / 100;
      if (!isFinite(num) || num < 0) return '';
      const endChar = useZheng ? '正' : '整';
      if (num === 0) return '港幣零元' + endChar;
      const digits = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
      const units = ['', '拾', '佰', '仟'];
      const bigUnits = ['', '萬', '億', '兆'];
      let [intStr, decStr] = num.toFixed(2).split('.');
      const intNum = parseInt(intStr, 10);
      let result = '';
      if (intNum > 0) {
        const groups = [];
        let s = intStr;
        while (s.length > 0) { groups.unshift(s.slice(-4)); s = s.slice(0, -4); }
        const groupCount = groups.length;
        groups.forEach((g, idx) => {
          const bigIdx = groupCount - 1 - idx;
          const gNum = parseInt(g, 10);
          if (gNum === 0) {
            const hasLater = groups.slice(idx + 1).some(x => parseInt(x, 10) !== 0);
            if (hasLater && result && !result.endsWith('零')) result += '零';
            return;
          }
          if (result && g.length === 4 && g[0] === '0' && !result.endsWith('零')) result += '零';
          let gStr = '', zeroFlag = false;
          for (let j = 0; j < g.length; j++) {
            const d = parseInt(g[j], 10);
            const u = g.length - 1 - j;
            if (d === 0) zeroFlag = true;
            else {
              if (zeroFlag && gStr) gStr += '零';
              zeroFlag = false;
              gStr += digits[d] + units[u];
            }
          }
          result += gStr + bigUnits[bigIdx];
        });
      }
      result = (intNum > 0 ? result : '零') + '元';
      const jiao = parseInt(decStr[0], 10);
      const fen = parseInt(decStr[1], 10);
      if (jiao === 0 && fen === 0) result += endChar;
      else {
        if (jiao > 0) result += digits[jiao] + '角';
        else if (fen > 0) result += '零';
        if (fen > 0) result += digits[fen] + '分';
      }
      return '港幣' + result;
    }

    const th = ['', 'thousand', 'million', 'billion'];
    const dg = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
    const tn = ['ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
    const tw = ['twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
    function toWords(s) {
      s = String(s).replace(/[\, ]/g, '');
      if (s != parseFloat(s)) return '';
      let x = s.indexOf('.');
      if (x === -1) x = s.length;
      if (x > 15) return 'too big';
      const n = s.split('');
      let str = '', sk = 0;
      for (let i = 0; i < x; i++) {
        if ((x - i) % 3 === 2) {
          if (n[i] === '1') { str += tn[Number(n[i + 1])] + ' '; i++; sk = 1; }
          else if (n[i] != 0) { str += tw[n[i] - 2] + ' '; sk = 1; }
        } else if (n[i] != 0) {
          str += dg[n[i]] + ' ';
          if ((x - i) % 3 === 0) str += 'hundred ';
          sk = 1;
        }
        if ((x - i) % 3 === 1) {
          if (sk) str += th[(x - i - 1) / 3] + ' ';
          sk = 0;
        }
      }
      return str.trim();
    }
    function numToUkEn(n) {
      const [intPart, decPart] = parseFloat(n).toFixed(2).split('.');
      let res = (toWords(intPart) || 'Zero') + ' Dollars';
      const cents = parseInt(decPart, 10);
      if (cents > 0) res += ' and ' + toWords(cents) + ' Cents';
      return (res + ' Only').toUpperCase();
    }
    function numToUsEn(n) {
      const [intPart, decPart] = parseFloat(n).toFixed(2).split('.');
      const dollars = toWords(intPart);
      return dollars.charAt(0).toUpperCase() + dollars.slice(1) + ' and ' + decPart.padStart(2, '0') + '/100 Dollars Only';
    }

    function checkDateValid(dateVal) {

      return null;

              <span class="text-[10px] font-bold text-indigo-600">美式寫法</span>
              <span class="text-[10px] text-slate-400">複製</span>
            </div>
            <div id="cq-us" class="font-mono font-semibold text-slate-700 text-xs leading-snug">--</div>
          </button>
        </section>

        <!-- 儲存 + 歷史 -->
        <div class="flex gap-2">
          <button type="button" id="cq-save" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-sm rounded-xl flex items-center justify-center gap-1.5 active:scale-95">
            <i data-lucide="save" class="w-4 h-4"></i> 存入紀錄
          </button>
        </div>

        <section class="card overflow-hidden">
          <div class="bg-slate-50 px-4 py-2.5 border-b border-slate-100 flex justify-between items-center">
            <span class="text-xs font-bold text-slate-500 uppercase flex items-center gap-1.5">
              <i data-lucide="history" class="w-3.5 h-3.5"></i>開票紀錄
            </span>
            <button type="button" id="cq-clear-hist" class="text-[10px] text-rose-500 font-semibold">清除全部</button>
          </div>
          <ul id="cq-hist" class="divide-y divide-slate-50 min-h-[40px] max-h-48 overflow-y-auto"></ul>
        </section>

        <section class="card p-3.5 space-y-2 text-[11px] text-slate-500 leading-relaxed">
          <p class="font-bold text-slate-600 flex items-center gap-1"><i data-lucide="info" class="w-3.5 h-3.5 text-indigo-500"></i>小提示</p>
          <p>· 劃線支票必須入戶口，不可提現，最安全。</p>
          <p>· 金額後面寫「正／整」並劃線至尾，防被加字。</p>
          <p>· 支票有效期一般為簽發日起 6 個月。</p>
        </section>
      </div>`;
    if (window.lucide) lucide.createIcons();

    function update() {
      const payee = $('cq-payee').value.trim() || '---';
      const amt = parseFloat($('cq-amt').value) || 0;
      const dateVal = $('cq-date').value;
      const crossed = $('cq-cross').checked;
      const bearer = $('cq-bearer').checked;
      const useZheng = $('cq-zheng').checked;

      const notice = $('cq-notice');
      const status = checkDateValid(dateVal);
      if (status) {
        notice.classList.remove('hidden');
        if (status.type === 'warn') {
          notice.className = 'text-xs font-medium px-3 py-2 rounded-xl border bg-amber-50 border-amber-100 text-amber-800';
          notice.textContent = status.msg;
        } else {
          notice.className = 'text-xs font-medium px-3 py-2 rounded-xl border bg-red-50 border-rose-100 text-rose-700';
          notice.textContent = status.msg;
        }
      } else notice.classList.add('hidden');

      $('cq-p-payee').textContent = payee;
      $('cq-p-num').textContent = amt.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (dateVal) {
        const [y, m, d] = dateVal.split('-');
        $('cq-p-date').textContent = `${d} / ${m} / ${y}`;
      } else $('cq-p-date').textContent = '-- / -- / ----';

      const g = $('cq-graphic');
      if (crossed) g.classList.add('cheque-crossed');
      else g.classList.remove('cheque-crossed');
      const be = $('cq-p-bearer');
      if (bearer) { be.classList.add('line-through', 'opacity-50'); }
      else { be.classList.remove('line-through', 'opacity-50'); }

      if (amt > 0) {
        const zh = numToZhCap(amt, useZheng);
        const uk = numToUkEn(amt);
        const us = numToUsEn(amt);
        $('cq-p-words').textContent = zh;
        $('cq-zh').textContent = zh;
        $('cq-uk').textContent = uk;
        $('cq-us').textContent = us;
      } else {
        ['cq-p-words', 'cq-zh', 'cq-uk', 'cq-us'].forEach(id => txt(id, '--'));
      }
    }

    function copyText(id) {
      const t = $(id)?.textContent;
      if (!t || t === '--') return;
      const ta = document.createElement('textarea');
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      // brief feedback
      const btn = $(id === 'cq-zh' ? 'cq-copy-zh' : id === 'cq-uk' ? 'cq-copy-uk' : 'cq-copy-us');
      if (btn) {
        const old = btn.querySelector('.text-slate-400');
        if (old) { old.textContent = '已複製'; setTimeout(() => { old.textContent = '複製'; }, 1200); }
      }
    }

    function getHist() {
      return JSON.parse(localStorage.getItem('cq_history') || '[]');
    }
    function renderHist() {
      const list = $('cq-hist');
      const hist = getHist();
      if (!hist.length) {
        list.innerHTML = '<li class="p-4 text-center text-slate-400 text-xs">暫無紀錄</li>';
        return;
      }
      list.innerHTML = hist.map(item => `
        <li class="px-4 py-2.5 flex justify-between items-center gap-2 text-xs">
          <div class="min-w-0 flex-1">
            <p class="font-semibold text-slate-700 truncate">${item.payee}</p>
            <p class="text-slate-400">${item.date} · ${item.type}</p>
          </div>
          <span class="font-bold text-slate-800 shrink-0">$${item.amount.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
          <button type="button" class="cq-reuse text-indigo-500 font-semibold shrink-0" data-id="${item.id}">重用</button>
          <button type="button" class="cq-del text-slate-300 hover:text-red-500 shrink-0" data-id="${item.id}" aria-label="刪除"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
        </li>`).join('');
      if (window.lucide) lucide.createIcons();
      list.querySelectorAll('.cq-reuse').forEach(b => {
        b.onclick = () => {
          const item = getHist().find(x => x.id === +b.dataset.id);
          if (!item) return;
          $('cq-payee').value = item.payee;
          $('cq-amt').value = item.amount;
          $('cq-date').value = todayStr();
          $('cq-cross').checked = item.type.includes('劃線');
          update();
        };
      });
      list.querySelectorAll('.cq-del').forEach(b => {
        b.onclick = () => {
          const hist2 = getHist().filter(x => x.id !== +b.dataset.id);
          localStorage.setItem('cq_history', JSON.stringify(hist2));
          renderHist();
        };
      });
    }

    ['cq-payee', 'cq-amt', 'cq-date', 'cq-cross', 'cq-bearer', 'cq-zheng'].forEach(id => {
      $(id)?.addEventListener('input', update);
      $(id)?.addEventListener('change', update);
    });
    $('cq-copy-zh').onclick = () => copyText('cq-zh');
    $('cq-copy-uk').onclick = () => copyText('cq-uk');
    $('cq-copy-us').onclick = () => copyText('cq-us');
    $('cq-save').onclick = () => {
      const payee = $('cq-payee').value.trim();
      const amount = parseFloat($('cq-amt').value);
      const date = $('cq-date').value;
      if (!payee || !amount || !date) return;
      const hist = getHist();
      hist.unshift({
        id: Date.now(),
        payee,
        amount,
        date,
        type: $('cq-cross').checked ? '劃線' : '不劃線',
      });
      localStorage.setItem('cq_history', JSON.stringify(hist.slice(0, 50)));
      renderHist();
    };
    $('cq-clear-hist').onclick = () => {
      if (confirm('確定清除所有開票紀錄？')) {
        localStorage.removeItem('cq_history');
        renderHist();
      }
    };

    window.addEventListener('reset-calc', e => {
      if (e.detail.id !== 'cheque') return;
      $('cq-payee').value = '陳大文';
      $('cq-amt').value = '12345.50';
      $('cq-date').value = todayStr();
      $('cq-cross').checked = true;
      $('cq-bearer').checked = true;
      $('cq-zheng').checked = true;
      update();
    });

    update();
    renderHist();
  }

  // ========== Boot ==========
  buildShell();
  initBMI();
  initMortgage();
  initParty();
  initSupermarket();
  initSushiro();
  initTime();
  initUnit();
  initCheque();
  goHome(false); // 預設顯示首頁

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW registered', reg.scope))
        .catch(err => console.warn('SW registration failed', err));
    });
  }
})();
</script>
</body>
</html>
